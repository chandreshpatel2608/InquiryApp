name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert_b64 = os.environ["IOS_CERTIFICATE_BASE64"]
          profile_b64 = os.environ["IOS_PROVISIONING_PROFILE_BASE64"]
          cert_path = Path(os.environ["RUNNER_TEMP"]) / "certificate.p12"
          profile_path = Path(os.environ["RUNNER_TEMP"]) / "profile.mobileprovision"

          cert_path.write_bytes(base64.b64decode(cert_b64))
          profile_path.write_bytes(base64.b64decode(profile_b64))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Build IPA
        run: flutter build ipa --release

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload XCArchive (debug backup)
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: app/build/ios/archive/Runner.xcarchive
          if-no-files-found: warn
